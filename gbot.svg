<svg viewBox="0 0 340 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBDFE5"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33363C"/>
      <stop offset="100%" stop-color="#14161A"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C1121F" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#C1121F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- flourish: brilho + anel aberto + linhas de velocidade -->
  <circle cx="168" cy="205" r="150" fill="url(#ringGlow)"/>
  <path d="M 232.3 76.9 A 138 138 0 1 1 48.7 156.9" fill="none" stroke="#C1121F" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <g stroke="#C1121F" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="6" y1="252" x2="48" y2="252"/>
    <line x1="2" y1="270" x2="40" y2="270"/>
    <line x1="10" y1="288" x2="44" y2="288"/>
  </g>

  <!-- sombra de apoio -->
  <ellipse cx="168" cy="352" rx="78" ry="12" fill="#000" opacity="0.35"/>

  <!-- antena -->
  <line x1="168" y1="28" x2="168" y2="60" stroke="#3a3d43" stroke-width="6" stroke-linecap="round"/>
  <circle cx="168" cy="22" r="11" fill="#C1121F"/>
  <circle cx="164" cy="18" r="3.2" fill="#ff8b8b" opacity="0.85"/>

  <!-- cabeca -->
  <rect x="88" y="56" width="160" height="118" rx="52" fill="url(#bodyGrad)" stroke="#B9BEC6" stroke-width="1.5"/>
  <path d="M 108 70 Q 168 52 228 70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="90" cy="116" r="15" fill="url(#darkGrad)"/>
  <circle cx="246" cy="116" r="15" fill="url(#darkGrad)"/>
  <circle cx="90" cy="116" r="5" fill="#54575d"/>
  <circle cx="246" cy="116" r="5" fill="#54575d"/>

  <!-- visor / tela -->
  <rect x="111" y="86" width="114" height="62" rx="22" fill="#0D0E10" stroke="#3a3d43" stroke-width="2"/>
  <text x="148" y="130" font-family="Space Grotesk, sans-serif" font-size="42" font-weight="700" fill="#C1121F" text-anchor="middle">G</text>
  <rect x="190" y="120" width="18" height="6" rx="3" fill="#C1121F" opacity="0.85"/>

  <!-- pescoco -->
  <rect x="148" y="170" width="40" height="20" rx="8" fill="#c7cbd1"/>

  <!-- torso -->
  <rect x="78" y="186" width="180" height="152" rx="48" fill="url(#bodyGrad)" stroke="#B9BEC6" stroke-width="1.5"/>
  <circle cx="96" cy="204" r="24" fill="url(#darkGrad)"/>
  <circle cx="240" cy="204" r="24" fill="url(#darkGrad)"/>

  <text x="168" y="246" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8f97" text-anchor="middle">EUROVIA</text>
  <text x="168" y="262" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a8f97" text-anchor="middle">NISSAN</text>

  <!-- braco -->
  <path d="M 100 238 C 66 250, 46 278, 46 308" fill="none" stroke="url(#darkGrad)" stroke-width="27" stroke-linecap="round"/>

  <!-- mao (garra simples) -->
  <g fill="url(#darkGrad)">
    <circle cx="46" cy="312" r="16"/>
    <circle cx="34" cy="322" r="8"/>
    <circle cx="48" cy="328" r="8"/>
    <circle cx="61" cy="321" r="8"/>
  </g>

  <!-- envelope -->
  <g transform="translate(-2,268) rotate(-10)">
    <rect x="6" y="6" width="90" height="60" rx="7" fill="#F4F5F7" stroke="#B9BEC6" stroke-width="2"/>
    <path d="M8 8 L51 44 L94 8" fill="none" stroke="#B9BEC6" stroke-width="2.5"/>
    <circle cx="51" cy="46" r="15" fill="#C1121F"/>
    <path d="M43 46 h16 M46 41 l5 5 -5 5 M56 41 l5 5 -5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
